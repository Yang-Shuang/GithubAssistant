<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>GitHub Reader - 详情</title>
    <link rel="stylesheet" href="/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
</head>
<body>
    <div class="header">
        <h1>📥 GitHub Reader</h1>
       <div class="nav">
            <a href="/">收件箱</a>
            <a href="/search.html" target="_blank">管理</a>
        </div>
    </div>
    
    <div class="container">
        <a href="/" class="back-link">← 返回收件箱</a>
        
        <div class="detail-header">
            <h2 id="repo-name"></h2>
            <div class="detail-meta">
                <span id="repo-stars"></span>
                <span id="repo-lang"></span>
                <a id="repo-link" target="_blank">GitHub →</a>
            </div>
            <p id="repo-desc"></p>
            <p id="repo-desc-zh" style="display: none; color: #888; font-size: 14px; margin-top: 4px;"></p>
        </div>
        
        <div class="detail-toolbar">
            <div class="toolbar-left">
                <div id="lang-switch"></div>
                <button class="fetch-btn" id="translate-btn" onclick="startTranslate()" style="padding: 8px 16px; font-size: 14px;">翻译</button>
                <span id="translate-status-text" style="font-size: 14px; color: #666;"></span>
            </div>
            <div class="toolbar-right">
                <button class="fetch-btn" id="read-btn" onclick="toggleReadStatus()" style="padding: 8px 16px; font-size: 14px; background: #28a745;">标记已读</button>
                <span id="read-status-text" style="font-size: 14px; color: #666;"></span>
            </div>
        </div>
        
        <div class="readme-content" id="readme-content">
            <div class="loading">加载中...</div>
        </div>
    </div>
    
    <script src="/app.js"></script>
</body>
</html>
